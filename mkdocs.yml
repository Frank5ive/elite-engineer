site_name: The Elite Engineer
site_description: Project-driven training system for full-stack, modern C++ and quant development
theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - sane_lists
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
repo_url: https://github.com/Frank5ive/elite-engineer
repo_name: Frank5ive/elite-engineer
plugins: [search]
extra_javascript: [assets/progress.js]
extra_css: [assets/progress.css]
